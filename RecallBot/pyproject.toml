[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recallbot-v12"
version = "0.1.0"
description = "V12 code-mixed personal budgeting assistant for PCA MZG517 Mini Project 1"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
evaluation = ["numpy>=1.26", "tiktoken>=0.7", "matplotlib>=3.8"]
embeddings = ["sentence-transformers>=3.0"]
benchmark = ["faiss-cpu>=1.8"]
test = ["pytest>=8.0"]

[project.scripts]
recallbot = "recallbot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
